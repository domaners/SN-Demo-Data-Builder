# Builds the Omi Drive Sync Android app and publishes the APK as a downloadable
# artifact on the run's page (Actions tab → this workflow → a run → Artifacts).
#
# Signing: add these repository secrets so every build uses the same key, which
# Google Sign-In needs (see omi-drive-sync/README.md, "Building with GitHub Actions"):
#   ANDROID_KEYSTORE_BASE64    the .jks keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
# Without them the APK is signed with a throwaway debug key that changes every run.
name: Omi Drive Sync APK

on:
  push:
    paths:
      - 'omi-drive-sync/**'
      - '.github/workflows/omi-drive-sync-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: omi-drive-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Install ffmpeg (for the end-to-end audio test)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key. Google sign-in will not work in this APK."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --build-number "${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/omi-drive-sync-${{ github.run_number }}.apk"

      - name: Show the signing key's SHA-1
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            sha1=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk '/SHA1:/ {print $2}')
            note="Register this SHA-1 on your Android OAuth client in Google Cloud (once)."
          else
            sha1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | awk '/SHA1:/ {print $2}')
            note="Throwaway debug key: it changes every run, so Google sign-in will not work. Add the signing secrets."
          fi
          {
            echo "### Omi Drive Sync APK"
            echo "Download **omi-drive-sync-apk** from the Artifacts section of this run."
            echo ""
            echo "Signing key SHA-1: \`$sha1\`"
            echo ""
            echo "$note"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: omi-drive-sync-apk
          path: omi-drive-sync/build/omi-drive-sync-${{ github.run_number }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/release.jks"
